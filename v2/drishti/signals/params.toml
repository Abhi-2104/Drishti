# Drishti signal parameters. Every number says where it came from. Edit here, not in code; each signal output records
# the `version` it ran with, so a change in a reading can be traced to a change in these numbers.
#
# source tags:
#   v1:<file>      ported unchanged from the TypeScript v1 (drishti-mcp/src/tools/<file> or .claude/commands/<file>)
#   scoring.md     config/scoring.md (the signal-weighting rubric)
#   provisional    not yet decided by you or your brother; a placeholder with the stated rationale. Outputs using these
#                  carry provisional=true so nobody mistakes them for calibrated thresholds.

version = "2026-11-08.3"

[macro_regime]                      # source: v1:macroRegime.ts ("calibration-sensitive heuristics, medium confidence")
dxy_bearish_above = 104.0
dxy_bullish_below = 100.0
us10y_bearish_above = 4.5
us10y_bullish_below = 3.8
brent_bearish_above = 90.0
brent_bullish_below = 75.0
india_vix_bearish_above = 20.0
india_vix_bullish_below = 14.0
usdinr_bearish_change_pct = 0.15    # rupee weakening by more than this in one session
usdinr_bullish_change_pct = -0.15
us_vix_premium_points = 2.0         # US VIX above India VIX by more than this = global risk not priced in India
max_input_age_days = 5              # an input older than this vs the as-of date counts as missing (UNKNOWN, never neutral)

[participant_oi]                    # source: v1:participantOi.ts (Sensibull logic)
label_by = "percentile"             # recommended 8 Nov: "percentile" = strong means extreme vs its own past year; "fixed" = v1 rule
strong_percentile = 20.0            # percentile mode: bottom 20% of the past year = strong bearish, top 20% = strong bullish
strong_threshold = 4                # fixed mode (v1): |(FII+Pro) - Client| >= this = strong divergence
segments = ["Index Futures", "Call Options", "Put Options"]
history_sessions = 250              # added 8 Nov: percentile of today's score vs its own past. Context only; the v1 score and
                                    # threshold are unchanged (replay: "strong bearish" on 85% of 240 sessions at +/-4)

[sector_rotation]                   # source: v1:sectorRotation.ts
benchmark = "Nifty 50"
ma_window = 20
min_points = 25
alert_lookback = 3                  # rotation alert = RS crossed above its MA in the last N sessions
history_days = 70                   # v1 pulled 70 calendar days
# v1's nine (Yahoo symbol -> NSE index name). Add more here to widen the read; v1 fidelity covers these nine.
sectors = { IT = "Nifty IT", Bank = "Nifty Bank", Pharma = "Nifty Pharma", FMCG = "Nifty FMCG", Metal = "Nifty Metal", Auto = "Nifty Auto", Realty = "Nifty Realty", Energy = "Nifty Energy", "Midcap 150" = "Nifty Midcap 150" }

[midcap_ratio]                      # source: roadmap Tier 0 (L3-2), ratio named in v1:macro.md cycle rules
numerator = "Nifty Midcap 150"
denominator = "Nifty 50"
ma_window = 20
change_window = 60                  # provisional: trend window for "outperforming / lagging"

[index_valuation]                   # source: ledger L3-5 (index PE / PB / yield); NSE's ind_close_all carries them daily
indices = ["Nifty 50", "Nifty Midcap 150", "Nifty Smallcap 250"]
cheap_percentile = 20.0             # PE at or below this percentile of its own stored history reads "cheap vs its history"
rich_percentile = 80.0
min_sessions_for_label = 250        # fewer stored sessions: the percentile is shown but marked provisional

[cycle_phase]                       # source: v1:macro.md "ECONOMIC PHASE" rules; vote-count method is provisional
late_brent_above = 88.0
late_us10y_above = 4.5
fii_window_days = 20                # provisional: "FII selling/buying" judged on this many sessions of cash flow
rates_window_days = 60              # provisional: "rates bottoming" = 10Y lower than this many sessions ago
defensives = ["FMCG", "Pharma"]     # provisional: v1 names IT/Pharma for late cycle and "defensives" without a list
missing_inputs = ["India/US/China PMI", "India CPI/WPI/IIP"]   # named in the blueprint as phase inputs not yet collected

[options_flow]                      # computed from the EOD F&O bhavcopy (L2-4); thresholds pending v0 guide
symbols = ["NIFTY", "BANKNIFTY"]
walls = 3                           # top-N call / put strikes by OI
label_by = "fixed"                  # "fixed" = the PCR levels below; "percentile" = extreme vs its own past
pcr_bullish_above = 1.3             # provisional: common market convention, NOT from your brother's v0 guide yet
pcr_bearish_below = 0.7             # provisional
extreme_percentile = 15.0           # percentile mode: top/bottom 15% of the past = put-heavy / call-heavy
provisional = true

[fii_dii]                           # L2-1; scoring.md: institutional flow is confirmation, not thesis
short_window = 5
long_window = 20
provisional = true                  # no thresholds decided: output is direction + streak, not a score

[liquidity]                         # roadmap Tier 1: "global liquidity: US M2 YoY + Fed balance sheet ... the master driver"
walcl_change_weeks = 13
provisional = true                  # direction only until thresholds are decided

[credit_spreads]                    # roadmap Tier 1: HY OAS as cross-check for genuine risk-off vs noise
widening_bp = 50.0                  # provisional: +50bp in `window` sessions = stress building
stress_level_pct = 5.0              # provisional
window = 20
provisional = true

[insider_cluster]                   # scoring.md #1: "size buying = strong +; selling cluster = strong -"; definitions provisional
window_days = 90
cluster_days = 30
cluster_min_persons = 3             # provisional: distinct insiders on the same side inside cluster_days
size_buy_crore = 1.0                # provisional: Rs 1 crore of open-market buying by insiders = "size"
insider_categories = ["Promoter", "Promoter Group", "Promoter and Director", "Director", "KMP", "Designated Person", "Immediate Relative"]
market_modes = ["Market Purchase", "Market Sale"]   # only open-market trades count; gifts, ESOPs, inter-se transfers do not
provisional = true

[pledge]                            # scoring.md quality floor
strong_caution_pledged_pct = 25.0   # scoring.md: ">25% pledged = strong caution" (of promoter holding)
rising_min_pp = 1.0                 # provisional: rise of this many points QoQ counts as "rising pledge" (scoring.md red flag)
