[project]
name = "drishti"
version = "0.1.0"
description = "Drishti investor copilot: Indian-market data, signals and MCP server"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "platformdirs>=4.2",
    "mcp>=2.3,<3",
    "pypdf>=5",
]

[project.scripts]
drishti = "drishti.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
